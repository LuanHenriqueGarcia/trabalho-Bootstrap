    </div>

  <main class="container py-4">
    <div class="row g-2 mb-3">
      <div class="col-md-10">
        <input id="busca" class="form-control" placeholder="Buscar por título, tema ou autor...">
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100 rounded" onclick="mostrarArtigos()">Buscar</button>
      </div>
    </div>

    <div id="aviso"></div>
    <div class="row g-4" id="lista"></div>
  </main>

  <div class="modal fade" id="modal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo"></h5>
          <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalCorpo"></div>
      </div>
    </div>
  </div>
