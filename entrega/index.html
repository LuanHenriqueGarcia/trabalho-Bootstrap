<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEPISEG - Artigos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark">
    <div class="container">
      <span class="navbar-brand">GEPISEG - Artigos</span>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-2 mb-3">
      <div class="col-md-10">
        <input id="busca" class="form-control" placeholder="Buscar por título, tema ou autor...">
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100" onclick="mostrarArtigos()">Buscar</button>
      </div>
    </div>

    <div id="aviso"></div>
    <div class="row g-4" id="lista"></div>
  </main>

  <div class="modal fade" id="modal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo"></h5>
          <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalCorpo"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/gepiseg-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
